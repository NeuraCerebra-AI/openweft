<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="dt dd">
<title id="dt">OpenWeft dashboard</title>
<desc id="dd">Animated terminal: a queue of three features waits in the ready state, then runs in parallel phases with live agent cards, then finishes with a verified completion summary.</desc>
<style>
text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:14.5px;fill:#cdd6f4;white-space:pre}
.b{font-weight:700}.mauve{fill:#cba6f7}.blue{fill:#89b4fa}.green{fill:#a6e3a1}.teal{fill:#94e2d5}.peach{fill:#fab387}.sub{fill:#a6adc8}.mut{fill:#585b70}.mu2{fill:#6c7086}
.dim{opacity:.62}
@keyframes k1{0%,26%{opacity:1}29%,97%{opacity:0}100%{opacity:1}}
@keyframes k2{0%,26%{opacity:0}29%,64%{opacity:1}67%,100%{opacity:0}}
@keyframes k3{0%,64%{opacity:0}67%,96%{opacity:1}99%,100%{opacity:0}}
.s1{animation:k1 16s linear infinite}
.s2{opacity:0;animation:k2 16s linear infinite}
.s3{opacity:0;animation:k3 16s linear infinite}
@keyframes sp{0%,24%{opacity:1}25%,100%{opacity:0}}
.f1,.f2,.f3,.f4{opacity:0;animation:sp .72s steps(1) infinite}
.f2{animation-delay:.18s}.f3{animation-delay:.36s}.f4{animation-delay:.54s}
.f1{animation-delay:0s}
@media (prefers-reduced-motion:reduce){.s1,.s3{animation:none;opacity:0}.s2{animation:none;opacity:1}.f1{animation:none;opacity:1}.f2,.f3,.f4{animation:none;opacity:0}}
</style>
<rect width="1040" height="640" rx="5" fill="#1e1e2e"/>
<circle cx="20" cy="20" r="6" fill="#ff5f58"/><circle cx="40" cy="20" r="6" fill="#ffbd2e"/><circle cx="60" cy="20" r="6" fill="#18c132"/>

<g class="s1">
  <text x="42" y="64"><tspan class="mauve b">◆ openweft</tspan><tspan class="mut"> │ </tspan><tspan class="green">codex</tspan><tspan class="mut"> · </tspan>gpt-5.5<tspan class="mut"> · </tspan><tspan class="peach">medium</tspan><tspan class="mut"> │ </tspan><tspan class="green">active 0</tspan><tspan class="mut"> · </tspan><tspan class="teal">pending 3</tspan><tspan class="mut"> │ </tspan>0:00</text>
  <rect x="36" y="84" width="968" height="100" fill="none" stroke="#89b4fa" stroke-width="2.5"/>
  <text x="54" y="116"><tspan class="mut">◌</tspan> <tspan class="b">001</tspan></text>
  <text x="996" y="116" text-anchor="end" class="mut">0:00</text>
  <text x="72" y="142" class="sub">add password reset flow</text>
  <text x="72" y="168" class="teal">queued from queue.txt</text>
  <rect x="36" y="198" width="968" height="74" fill="none" stroke="#585b70" stroke-width="1.25"/>
  <text x="54" y="228"><tspan class="mut">◌</tspan> <tspan class="b">002</tspan></text>
  <text x="996" y="228" text-anchor="end" class="mut">0:00</text>
  <text x="72" y="254" class="sub">add audit log export</text>
  <rect x="36" y="286" width="968" height="74" fill="none" stroke="#585b70" stroke-width="1.25"/>
  <text x="54" y="316"><tspan class="mut">◌</tspan> <tspan class="b">003</tspan></text>
  <text x="996" y="316" text-anchor="end" class="mut">0:00</text>
  <text x="72" y="342" class="sub">refactor auth middleware</text>
  <text x="42" y="614"><tspan class="blue b"> NORMAL </tspan>  <tspan class="b">s</tspan><tspan class="sub"> start</tspan>  <tspan class="b">m</tspan><tspan class="sub"> model</tspan>  <tspan class="b">a</tspan><tspan class="sub"> add</tspan>  <tspan class="b">d</tspan><tspan class="sub"> remove</tspan>  <tspan class="b">h</tspan><tspan class="sub"> history</tspan>  <tspan class="b">?</tspan><tspan class="sub"> help</tspan></text>
</g>

<g class="s2">
  <text x="42" y="64"><tspan class="mauve b">◆ openweft</tspan><tspan class="mut"> │ </tspan><tspan class="blue">⚙ 1/2</tspan><tspan class="mut"> │ </tspan><tspan class="green">codex</tspan><tspan class="mut"> · </tspan>gpt-5.5<tspan class="mut"> · </tspan><tspan class="peach">medium</tspan><tspan class="mut"> │ </tspan><tspan class="green">active 1</tspan><tspan class="mut"> · </tspan><tspan class="teal">pending 1</tspan><tspan class="mut"> │ </tspan><tspan class="peach">78.0k tokens</tspan><tspan class="mut"> │ </tspan>6:52</text>
  <text x="42" y="92"><tspan class="blue">Phase 1/2</tspan><tspan class="mut"> · </tspan><tspan class="green">completed 1/3</tspan><tspan class="mut"> · </tspan><tspan class="peach">78k tokens</tspan><tspan class="mut"> · </tspan><tspan class="sub">elapsed 6:52</tspan></text>
  <rect x="36" y="110" width="968" height="126" fill="none" stroke="#89b4fa" stroke-width="2.5"/>
  <g class="blue"><text x="54" y="142" class="f1">⠋</text><text x="54" y="142" class="f2">⠙</text><text x="54" y="142" class="f3">⠸</text><text x="54" y="142" class="f4">⠴</text></g>
  <text x="72" y="142" class="b">001</text>
  <text x="996" y="142" text-anchor="end"><tspan class="green">2 files</tspan>  <tspan class="peach">41.2k tok</tspan> <tspan class="mut">5:12</tspan></text>
  <text x="72" y="168" class="sub">add password reset flow</text>
  <text x="72" y="194"><tspan class="green">files: </tspan><tspan class="mut">src/auth/reset.ts, src/email.ts</tspan></text>
  <text x="72" y="220" class="mauve">▸ Edit src/auth/reset.ts</text>
  <rect x="36" y="250" width="968" height="74" fill="none" stroke="#a6e3a1" stroke-width="1.25"/>
  <g class="dim">
    <text x="54" y="280"><tspan class="green">✔</tspan>  <tspan class="b">002</tspan></text>
    <text x="996" y="280" text-anchor="end"><tspan class="green">1 files</tspan>  <tspan class="peach">36.8k tok</tspan> <tspan class="mut">4:28</tspan></text>
    <text x="72" y="306" class="sub">add audit log export</text>
  </g>
  <rect x="36" y="338" width="968" height="74" fill="none" stroke="#585b70" stroke-width="1.25"/>
  <text x="54" y="368"><tspan class="mut">◌</tspan> <tspan class="b">003</tspan></text>
  <text x="996" y="368" text-anchor="end" class="mut">0:00</text>
  <text x="72" y="394" class="sub">refactor auth middleware</text>
  <text x="42" y="614"><tspan class="blue b"> NORMAL </tspan>  <tspan class="b">a</tspan><tspan class="sub"> add</tspan>  <tspan class="b">d</tspan><tspan class="sub"> remove</tspan>  <tspan class="b">h</tspan><tspan class="sub"> history</tspan>  <tspan class="b">q</tspan><tspan class="sub"> stop run</tspan>  <tspan class="b">?</tspan><tspan class="sub"> help</tspan></text>
</g>

<g class="s3">
  <text x="42" y="64"><tspan class="mauve b">◆ openweft</tspan><tspan class="mut"> │ </tspan><tspan class="green">codex</tspan><tspan class="mut"> · </tspan>gpt-5.5<tspan class="mut"> · </tspan><tspan class="peach">medium</tspan><tspan class="mut"> │ </tspan>14:36</text>
  <rect x="36" y="84" width="968" height="516" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="520" y="276" text-anchor="middle" class="green b">Run complete</text>
  <text x="520" y="306" text-anchor="middle">Status completed</text>
  <text x="520" y="336" text-anchor="middle">Planned 3 <tspan class="mut">·</tspan> Merged 3</text>
  <text x="520" y="366" text-anchor="middle">HEAD 4f2a91c</text>
  <text x="520" y="396" text-anchor="middle" class="sub">Durability verified (3/3 completed features)</text>
  <text x="520" y="426" text-anchor="middle" class="sub">codex-home cleaned</text>
  <text x="520" y="456" text-anchor="middle" class="mu2">Press q to exit</text>
</g>
</svg>
